[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "techno-cli"
version = "0.1.0"
description = "ani-cli style multi-provider anime player for the terminal"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["requests>=2.25"]

[project.scripts]
techno-cli = "techno_cli.cli:main"

[tool.setuptools.packages.find]
include = ["techno_cli*"]
